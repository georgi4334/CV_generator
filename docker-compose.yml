# Local development services. Production uses Neon (Postgres) and Cloudflare R2 (S3).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cv_generator
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cv -d cv_generator']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for photos and logos (stand-in for Cloudflare R2)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
