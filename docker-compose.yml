# Local development services. Production uses Neon (Postgres).
# S3-compatible file storage (for photos and logos) is added in Step 8.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cv_generator
    # Host port 5433, so it never clashes with a PostgreSQL installed directly on the computer (5432).
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cv -d cv_generator']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
